<!DOCTYPE html>
<html>
<head>
  <title>Buggy Example</title>
  <style>
    body {
      background-color: lightblue; /*It was backgroundcolor and should be with a - so background-color*/
    }

    #box {
      width: 100px;
      height: 100px;
      background: red;
      position: relative; /* To make the box move we should change its position to relative */
    }
  </style>
</head>
<body>

  <h1>Bug Practice</h1>

  <input id="nameInput" type="text">
  <button onclick="start()">Start</button>

  <div id="box"></div>

  <script>
    let counter = 0; // counter alone is not a defined a variable, it should have "let" before.
    let interval; // Interval used in the function wasn't defined
    function start() {
      let input = document.getElementById("nameInput"); // The ID of this input is "nameInput" not "name"
      console.log(input.value);

      interval = setInterval(function () {
        counter++;
        document.body.style.backgroundColor = "yellow"; // was documentstyel , should be document.body.style
        let box = document.getElementById("box"); // The ID of this box is "box" not as written "boxx"
        box.style.left = counter + "px";

        if (counter === 10) {
          clearInterval(interval);
          counter = 0;
        }
      });
    }
  </script>

</body>
</html>
